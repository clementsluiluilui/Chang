<style id="theme">/* ==========================================================================
   THEME — tout le style de l'application. Les ressources lourdes sont dans
   <style id="assets"> au-dessus. Nettoyé : aucune déclaration écrasée ne reste.
   ========================================================================== */
/* ---- VARIABLES PRINCIPALES : pour changer le look, modifier ICI ----
   --accent / --accent-rgb : rouge sombre (boutons, jour actuel, sélection)
   --porcelain             : fond blanc porcelaine (cartes, fenêtres, zones de texte)
   --wood-d                : brun très sombre (liserés, bois)                              */
:root{
  --accent:#7f1a10;
  --accent-rgb:127,26,16;
  --porcelain:#fbfaf7;
}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;
  flex-direction:column;
}
.bar{
  display:flex;
  width:100%;
  background:var(--bar);
  border-bottom:1px solid var(--line);
}
.bar.sub{background:var(--bar2);height:44px}
.tab{
  flex:1 1 0;
  min-width:0;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 8px;
  cursor:pointer;
  user-select:none;
  color:var(--mut);
  border-right:1px solid var(--line);
  border-bottom:2px solid transparent;
  transition:background .15s,color .15s;
}
.sub .tab{padding:10px 8px;font-size:14px}
.tab:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.tab.active{
  color:var(--txt);
  border-bottom-color:var(--acc);
  background:rgba(110,168,255,.08);
}
.tab.over{box-shadow:inset 3px 0 0 var(--acc)}
.tab.drag{opacity:.4}
.label{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  outline:none;
  max-width:100%;
  padding:0 18px;
}
.label[contenteditable=true]{
  background:#0b0d11;
  border:1px solid var(--acc);
  border-radius:4px;
  color:var(--txt);
  text-overflow:clip;
  cursor:text;
}
.x{
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--mut);
  cursor:pointer;
  font-size:14px;
  line-height:1;
  display:none;
}
.tab:hover .x{display:block}
.x:hover{background:#3a2025;color:#ff8a8a}
.add{
  flex:0 0 44px;
  border:0;
  background:transparent;
  color:var(--mut);
  font-size:20px;
  cursor:pointer;
}
.add:hover{color:var(--acc);background:rgba(255,255,255,.04)}
.add.empty{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:14px;
}
.add.empty b{
  font-size:20px;
  font-weight:400;
  line-height:1;
}
main{
  flex:1;
  min-height:0;
  display:flex;
}
:root{--fs:15px}
.view{
  flex:1;
  min-height:0;
  display:flex;
}
#content{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.side{
  width:220px;
  flex:none;
  display:flex;
  flex-direction:column;
  transition:width .2s;
  overflow:hidden;
}
.side button,.side .fr,.side .cr{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
  font:inherit;
  cursor:pointer;
  white-space:nowrap;
}
.side .ic{
  width:20px;
  height:20px;
  flex:none;
  display:flex;
}
.side svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.side .tx{transition:opacity .15s}
.side.closed .tx{opacity:0}
.week{
  flex:1;
  min-width:0;
  display:block;
  overflow-y:auto;
  padding:12px;
  scrollbar-width:auto;
}
.week::-webkit-scrollbar{width:14px}
.week::-webkit-scrollbar-thumb{border-radius:8px}
.grid{
  display:grid;
  grid-template-columns:112px repeat(7,1fr);
  min-height:100%;
  overflow:clip;
}
.dh{padding:8px;text-align:center}
.dh b{margin-left:6px}
.dh.today b{border-radius:10px;padding:1px 7px}
.hr{
  font-size:11px;
  color:var(--mut);
  text-align:right;
  padding:3px 8px 0 0;
}
.ev{
  position:relative;
  flex:none;
  box-sizing:border-box;
  border-radius:8px;
  padding:4px 8px;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:1px;
  font-size:var(--fs);
  line-height:1.25;
}
.ev b{
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.ev small{
  color:var(--mut);
  font-size:11px;
  white-space:nowrap;
}
.modal .lbl{
  display:block;
  font-size:13px;
  color:var(--mut);
  margin:0 0 4px;
}
/* Ligne « Sans horaire » : tâches du jour */
.hr.tl{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:var(--fs);
  line-height:1.2;
  padding:6px 4px;
}
.tcell{
  box-sizing:border-box;
  min-height:120px;
  max-height:260px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:6px;
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.tcell.today{background:rgba(110,168,255,.05)}
.tcell .wa,.hcell .wa{
  flex:none;
  margin:auto;
  width:26px;
  height:26px;
  padding:0;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--bar2);
  color:var(--mut);
  font:inherit;
  font-size:17px;
  line-height:1;
  cursor:pointer;
  opacity:.4;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tcell:hover .wa,.tcell .wa:focus-visible,.hcell:hover .wa,.hcell .wa:focus-visible{
  opacity:1;
  border-color:var(--acc);
  color:var(--acc);
}
@media(hover:none){
  .tcell .wa,.hcell .wa{opacity:.7}
}
.tk{
  flex:none;
  display:flex;
  align-items:flex-start;
  gap:6px;
  background:var(--bar2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:3px 6px;
  font-size:var(--fs);
  line-height:1.3;
}
.tk:hover{border-color:var(--acc)}
.tk input{
  margin:2px 0 0;
  accent-color:var(--acc);
  flex:none;
}
.tk .tt{
  flex:1;
  min-width:0;
  cursor:pointer;
  overflow-wrap:anywhere;
}
.tk small{color:var(--mut)}
.tk.done .tt{color:var(--mut);text-decoration:line-through}
/* Habitudes (ligne de l'agenda) */
.hcell{
  box-sizing:border-box;
  min-height:120px;
  max-height:260px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:4px 6px;
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.hcell.today{background:rgba(110,168,255,.05)}
.hk{
  flex:none;
  display:flex;
  align-items:flex-start;
  gap:6px;
  background:var(--bar2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:3px 6px;
  font-size:var(--fs);
  line-height:1.3;
}
.hk{
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}
.hk input{
  margin:2px 0 0;
  flex:none;
  pointer-events:none;
}
.hk .tt{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}
.hk.done .tt{color:var(--mut);text-decoration:line-through}
/* Tâches quotidiennes à heure fixe */
.fcell{
  position:relative;
  box-sizing:border-box;
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.fcell.today{background:rgba(110,168,255,.05)}
.fcell .wa{
  width:26px;
  height:26px;
  padding:0;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--bar2);
  color:var(--mut);
  font:inherit;
  font-size:17px;
  line-height:1;
  cursor:pointer;
  opacity:.4;
  display:flex;
  align-items:center;
  justify-content:center;
}
.fcell:hover .wa,.fcell .wa:focus-visible{
  opacity:1;
  border-color:var(--acc);
  color:var(--acc);
}
@media(hover:none){
  .fcell .wa{opacity:.8}
}
.rl{
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-end;
  gap:2px;
  padding:6px 8px 6px 0;
  font-size:10px;
  line-height:1.2;
  color:var(--mut);
  text-align:right;
}
.rl:not(.busy){
  align-items:center;
  text-align:center;
  padding:6px 4px;
  font-size:var(--fs);
}
.grid>.ev{align-self:stretch;min-height:0}
.ev{min-height:16px}
.ev.sm{
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:0 6px;
  font-size:var(--fs);
}
.ev.sm small{font-size:10px}
.tr{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}
.tr>div{flex:1;min-width:0}
.tr .ps{margin-bottom:0}
.hrow input[type=time]{
  background:#0b0d11;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:8px;
  padding:5px 8px;
  font:inherit;
  color-scheme:dark;
}
.ev .dtl{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:0;
  max-width:100%;
}
.ev .dtl input{
  accent-color:#5fd0a5;
  flex:none;
  margin:0;
}
.ev.dt.done b,.ev.pt.done b{text-decoration:line-through;color:var(--mut)}
.ev.pt .dtl{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:0;
  max-width:100%;
}
.ev.pt .dtl input{flex:none;margin:0}
.hcnt{
  font-size:12px;
  color:var(--mut);
  white-space:nowrap;
}
/* Fenêtres : choix du type + jours */
.seg{
  display:flex;
  gap:6px;
  margin:0 0 12px;
}
.seg button{
  flex:1;
  min-width:0;
  font-size:13px;
  padding:6px 6px;
  border:1px solid var(--line);
  background:var(--bar2);
  color:var(--mut);
  border-radius:8px;
  font:inherit;
  cursor:pointer;
}
.seg button.on{
  border-color:var(--acc);
  color:var(--txt);
  background:rgba(110,168,255,.15);
}
.dd{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.dchip{
  width:30px;
  height:30px;
  padding:0;
  border-radius:50%;
  border:1px solid var(--line);
  font:inherit;
  cursor:pointer;
}
.dchip:disabled{opacity:.3;cursor:not-allowed}
.err{font-size:12px;margin:6px 0 0}
/* Module Habitudes (Classeur) */
.hb{max-width:900px}
.hsec{margin-bottom:28px}
.hsh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}
.hsh h3{
  margin:0;
  font-size:15px;
  font-weight:600;
}
.hnote{
  margin:0 0 12px;
  font-size:12px;
  color:var(--mut);
}
.hl{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.hrow{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--bar2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
}
.hrow .hn{
  flex:1 1 180px;
  min-width:0;
  background:transparent;
  border:0;
  border-bottom:1px solid transparent;
  color:var(--txt);
  font:inherit;
  padding:4px 2px;
  outline:none;
}
.hrow .hn:focus{border-bottom-color:var(--acc)}
.hrow select{
  background:#0b0d11;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:8px;
  padding:5px 8px;
  font:inherit;
}
.hrow .dd{margin:0}
.hdel{
  border:1px solid var(--line);
  background:transparent;
  color:var(--mut);
  border-radius:8px;
  padding:4px 10px;
  font:inherit;
  cursor:pointer;
}
.hdel:hover,.hdel.arm{color:#ff8a8a;border-color:#ff8a8a}
.row{
  display:flex;
  background:var(--bar);
  border-bottom:1px solid var(--line);
}
.row.subrow{background:var(--bar2);height:45px}
.row .bar{
  flex:1;
  width:auto;
  min-width:0;
  border-bottom:0;
  background:transparent;
}
.io{
  flex:none;
  border:0;
  border-left:1px solid var(--line);
  background:transparent;
  color:var(--mut);
  font:inherit;
  font-size:14px;
  width:96px;
  padding:0;
  cursor:pointer;
  margin-left:auto;
}
.io:hover{color:var(--acc);background:rgba(255,255,255,.04)}
.notes{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:20px;
}
.nh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.nh h2{
  margin:0;
  font-size:18px;
  font-weight:600;
}
.nn,.ok,.ghost{
  border:1px solid var(--line);
  background:var(--bar2);
  color:var(--txt);
  font:inherit;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}
.nn:hover,.ghost:hover{border-color:var(--acc)}
.ok{border-color:var(--acc);font-weight:600}
.nl{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:12px;
}
.nc{
  position:relative;
  background:var(--bar);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  cursor:pointer;
  min-height:90px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.nc:hover{border-color:var(--acc)}
.nt{
  white-space:pre-wrap;
  word-break:break-word;
  flex:1;
}
.nd{font-size:12px;color:var(--mut)}
.nx{
  position:absolute;
  top:6px;
  right:6px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--mut);
  cursor:pointer;
  display:none;
}
.nx:hover{background:#3a2025;color:#ff8a8a}
.sn{
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:12px 14px;
  overflow:auto;
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
}
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--bar2);
  border:1px solid var(--line);
  padding:10px 16px;
  border-radius:8px;
  z-index:40;
}
.snh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 4px 10px;
}
.snh h2{
  margin:0;
  font-size:20px;
  font-weight:700;
}
.snp{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--txt);
  font-size:20px;
  cursor:pointer;
}
.snp:hover{background:rgba(255,255,255,.07)}
.sr{
  display:flex;
  align-items:center;
  gap:8px;
  height:48px;
  padding:0 6px 0 8px;
  border-top:1px solid var(--line);
  cursor:pointer;
}
.sr:hover{background:rgba(255,255,255,.04)}
.st{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.sx{
  width:28px;
  height:28px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:var(--mut);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sx:hover{background:#3a2025;color:#ff8a8a}
.sx svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.ov{
  position:fixed;
  inset:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:15vh;
  z-index:30;
}
.modal{
  width:min(560px,92vw);
  background:var(--bar);
  border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.mh{font-weight:600;margin-bottom:10px}
.modal textarea{
  width:100%;
  height:160px;
  resize:vertical;
  background:#0b0d11;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
  font:inherit;
  outline:none;
}
.modal textarea:focus{border-color:var(--acc)}
.modal .ps{
  width:100%;
  margin-bottom:10px;
  background:#0b0d11;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 10px;
  font:inherit;
  outline:none;
}
.modal .ps:focus{border-color:var(--acc)}
.mf{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}
.hint{
  flex:1;
  font-size:12px;
  color:var(--mut);
}
.menu{
  position:fixed;
  z-index:20;
  width:180px;
  background:var(--bar2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:4px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.menu button{
  display:block;
  width:100%;
  text-align:left;
  padding:9px 12px;
  border:0;
  background:transparent;
  font:inherit;
  border-radius:6px;
  cursor:pointer;
}
/* Projets */
.cd{
  border:0;
  background:transparent;
  color:var(--mut);
  cursor:pointer;
  border-radius:50%;
  width:22px;
  height:22px;
  flex:none;
}
.cd:hover{background:#3a2025;color:#ff8a8a}
.pe .gt{
  flex:1;
  min-width:0;
  margin:0;
  font-size:20px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.side button,.side .fr,.side .cr{flex:none}
.side .fr{
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  outline:none;
}
.side .cr{
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  outline:none;
}
.side .cr:focus-visible{box-shadow:inset 0 0 0 1px var(--acc)}
.side .fr:focus-visible{box-shadow:inset 0 0 0 1px var(--acc)}
.ghost:disabled{opacity:.35;cursor:default}
.ghost:disabled:hover{border-color:var(--line)}
.side .tx{overflow:hidden;text-overflow:ellipsis}
.side .pl{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
}
.pe{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  padding:20px;
  gap:12px;
}
.pe .ph{
  display:flex;
  align-items:center;
  gap:10px;
}
.pj-title{
  flex:1;
  min-width:0;
  background:transparent;
  border:0;
  border-bottom:1px solid transparent;
  color:var(--txt);
  font:inherit;
  font-size:20px;
  font-weight:700;
  padding:4px 2px;
  outline:none;
}
.pj-title:focus{border-bottom-color:var(--acc)}
.pj-text{
  flex:1;
  min-height:0;
  resize:none;
  width:100%;
  overflow:auto;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#0b0d11;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  font:inherit;
  line-height:1.55;
  outline:none;
}
.pj-text:focus{border-color:var(--acc)}
.pj-text[contenteditable='true']:empty:before{content:attr(data-ph);opacity:.58;pointer-events:none}
.pj-text a{color:inherit;text-decoration:underline;cursor:pointer}
/* Liste mixte : paragraphes et cases à cocher */
.list-editor{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:auto;
}
.list-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.list-blocks{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.lb{
  display:flex;
  align-items:flex-start;
  gap:10px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px;
}
.lb textarea{
  flex:1;
  min-width:0;
  min-height:42px;
  resize:none;
  overflow:hidden;
  background:transparent;
  color:var(--txt);
  border:0;
  font:inherit;
  line-height:1.55;
  outline:none;
  padding:0;
}
.lb input[type=checkbox]{
  margin-top:5px;
  accent-color:var(--acc);
  width:16px;
  height:16px;
  flex:none;
}
.lb.done textarea{color:var(--mut);text-decoration:line-through}
.lb .cd{margin-top:1px}
.pn{font-weight:600}
.sub-chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.chip{
  border:1px solid var(--line);
  background:var(--bar2);
  color:var(--txt);
  font:inherit;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
}
.chip:hover{border-color:var(--acc)}
.side .chv{
  margin-left:auto;
  flex:none;
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  color:var(--mut);
}
.side .chv:hover{background:rgba(255,255,255,.1);color:var(--txt)}
.side.closed .chv{display:none}
.side .fchv,.side .eye{
  margin-left:auto;
  flex:none;
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  color:var(--mut);
}
.side .fchv:hover,.side .eye:hover{background:rgba(255,255,255,.1);color:var(--txt)}
.side .eye{opacity:.5}
.side .cr:hover .eye{opacity:1}
.side.closed .fchv,.side.closed .eye{display:none}
.eye svg,.ce svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.ce{
  border:0;
  background:transparent;
  color:var(--mut);
  cursor:pointer;
  border-radius:6px;
  padding:4px 6px;
  display:flex;
  align-items:center;
}
.ce:hover{color:var(--txt)}
.ce.off{color:var(--acc)}
.vm{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.chip.on{border-color:var(--acc);background:rgba(110,168,255,.12)}
/* Notes rapides : colonnes */
.kb{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:20px 20px 12px;
}
.cols{
  flex:1;
  min-height:0;
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:8px;
}
.col{
  flex:none;
  width:280px;
  display:flex;
  flex-direction:column;
  min-height:0;
  transition:border-color .12s,background .12s;
}
.ch{
  display:flex;
  align-items:center;
  gap:6px;
}
.coldrag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:25px;
  height:28px;
  padding:0 3px;
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--mut);
  cursor:grab;
  font-size:18px;
  line-height:1;
  user-select:none;
  touch-action:none;
}
.col.col-moving{opacity:.45}
.cols .col.hot{outline-offset:2px}
.cn{
  flex:1;
  min-width:0;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font:inherit;
  font-weight:600;
  padding:4px 6px;
  outline:none;
}
.cc{
  font-size:12px;
  color:var(--mut);
  padding:0 4px;
}
.cx{
  border:0;
  background:transparent;
  color:var(--mut);
  cursor:pointer;
  border-radius:6px;
  padding:4px 8px;
  font:inherit;
  font-size:14px;
}
.cx:hover,.cx.arm{background:#3a2025;color:#ff8a8a}
.cl{
  flex:1;
  min-height:60px;
  overflow-y:auto;
  padding:4px 10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.ca{
  flex:none;
  margin:0 10px 6px;
  padding:8px;
  border:1px dashed var(--line);
  border-radius:8px;
  background:transparent;
  color:var(--mut);
  font:inherit;
  font-size:14px;
  cursor:pointer;
}
.ca:hover{color:var(--acc);border-color:var(--acc)}
.ac{
  flex:none;
  width:200px;
  align-self:flex-start;
  padding:12px;
  border:1px dashed var(--line);
  border-radius:12px;
  background:transparent;
  color:var(--mut);
  font:inherit;
  cursor:pointer;
}
.ac:hover{color:var(--acc);border-color:var(--acc)}
.kc{
  position:relative;
  flex:none;
  background:var(--bar2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  cursor:grab;
  display:flex;
  flex-direction:column;
  gap:6px;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
.kc:hover{border-color:var(--acc)}
.kc.expanded .nt{
  display:block;
  -webkit-line-clamp:unset;
  overflow:visible;
  white-space:pre-wrap;
  user-select:text;
  cursor:text;
}
.kc.expanded{cursor:pointer}
.del-note{
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
  font:inherit;
}
.kc:hover .nx{display:block}
.kc .nt{
  display:-webkit-box;
  -webkit-line-clamp:6;
  -webkit-box-orient:vertical;
  overflow:hidden;
  white-space:normal;
  flex:none;
}
.kc.src{opacity:.35;border-style:dashed}
.kc.gh{
  position:fixed;
  z-index:60;
  margin:0;
  pointer-events:none;
  opacity:.95;
  transform:rotate(2deg);
}
body.dragging,body.dragging *{
  cursor:grabbing!important;
  user-select:none;
  -webkit-user-select:none;
}
@media(hover:none){
  .kc .nx{display:block}
}
@media(max-width:600px){
  .col{width:min(280px,82vw)}
  .kb{padding:14px 12px 8px}
}
.kc .nt{
  user-select:text;
  -webkit-user-select:text;
  -webkit-touch-callout:default;
}
.hr.tl,.rl:not(.busy){font-weight:700;font-size:16px}
.ev b,.tk .tt,.hk .tt{font-weight:400}
.rl.busy{
  flex-direction:row;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  column-gap:5px;
  font-size:16px;
  font-weight:700;
  color:var(--txt);
  line-height:1.1;
  padding:2px 4px;
}
.rl.busy span{white-space:nowrap}
.rl.busy span:first-child:not(:empty)::after{content:' →'}
.rl.busy span:first-child:empty::after{content:'→'}
.grid>.ev{margin:2px 6px;padding:1px 8px}
.dhc{
  display:flex;
  align-items:center;
  justify-content:center;
}
.fsb{
  width:100%;
  height:100%;
  min-height:30px;
  background:transparent;
  border:0;
  font-size:17px;
  cursor:pointer;
}
body.focus .row,body.focus #side,body.focus #rightside{display:none}
.hr.tl,.rl:not(.busy),.ev,.tk .tt,.hk .tt{color:var(--txt)}
/* ======================================================================
   THÈME « SHOGUN » — écran Diplomatie
   Bois rouge sombre (2 barres du haut) · parchemin (barre latérale + centre)
   ====================================================================== */
:root{
  color-scheme:light;
  --bg:#e8e0d0;
  --bar:#f0e8d8;
  --bar2:#e0d8c8;
  --line:#a3977f;
  --txt:#1d1710;
  --mut:#4a3d29;
  --acc:var(--accent);
  --wood-d:#1c0805;
  --wood-m:#3b130e;
  --wood-l:#5e2118;
  --ink:#2b2016;
  --crimson:var(--accent);
  --gold:var(--accent);
  --sil1:#ece9e2;
  --sil2:#cbc7bd;
  /* textures */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .15 0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --bamboo:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='600' viewBox='0 0 240 600'><g fill='%23544a36' fill-opacity='.10'><rect x='30' y='0' width='22' height='600'/><rect x='110' y='80' width='16' height='520'/><rect x='170' y='200' width='12' height='400'/></g><g stroke='%23544a36' stroke-opacity='.16' stroke-width='3'><path d='M28 90h26M28 210h26M28 330h26M28 450h26M28 570h26M108 170h20M108 300h20M108 430h20M108 560h20M168 290h16M168 420h16M168 550h16'/></g><g fill='%23544a36' fill-opacity='.09'><ellipse cx='95' cy='250' rx='46' ry='9' transform='rotate(-28 95 250)'/><ellipse cx='70' cy='330' rx='40' ry='8' transform='rotate(24 70 330)'/><ellipse cx='150' cy='400' rx='38' ry='8' transform='rotate(-20 150 400)'/></g></svg>");
  --parch:var(--grain),
          radial-gradient(120% 90% at 50% 40%,#f0e8d8 0%,#e0d8c8 70%,#d0c8b8 100%);
}
body{background:var(--wood-d);color:var(--txt)}
/* ---------- Cadre : panneaux de parchemin (gauche + centre) ---------- */
main{
  background:var(--wood-d);
  padding:8px;
  gap:8px;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px),linear-gradient(180deg,#2b0f0a,var(--wood-d));
}
.side,#content{
  background:var(--bamboo) left bottom/170px auto no-repeat,var(--parch);
  border:2px solid #0c0502;
  border-radius:2px;
  box-shadow:inset 0 0 0 1px #f1ead6,inset 0 0 0 3px #a89c80,inset 0 0 40px rgba(90,70,30,.18),0 0 0 1px #6e2a1d;
}
.side{border-right:2px solid #0c0502}
#content{background:var(--bamboo) right bottom/200px auto no-repeat,var(--parch);position:relative}
/* barre latérale : rangées argentées arrondies (liste des clans) */
.side button,.side .fr,.side .cr{
  height:40px;
  border:1px solid #6f6757;
  border-radius:10px;
  color:var(--txt);
  font-family:var(--font);
  font-weight:600;
  background:linear-gradient(180deg,var(--sil1),var(--sil2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),2px 2px 0 rgba(40,30,15,.35);
}
.side button:hover,.side .fr:hover,.side .cr:hover{background:linear-gradient(180deg,#f7f5ef,#d8d4c9);color:var(--crimson)}
.side .it.on{
  background:linear-gradient(180deg,#f9f6ec,#e1dccc);
  color:var(--crimson);
  border:2px solid var(--gold);
  box-shadow:0 0 0 1px #2b200a,inset 0 1px 0 #fff,2px 2px 0 rgba(40,30,15,.4);
}
.side .tog{margin-bottom:8px}
.side svg{stroke-width:2}
.side .pl{
  border-top:1px dotted #5a4d36;
  margin-top:8px;
  padding-top:10px;
  gap:6px;
}
.side .chv:hover,.side .fchv:hover,.side .eye:hover{background:rgba(0,0,0,.1);color:var(--crimson)}
.side .cr:focus-visible,.side .fr:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
/* ---------- Contenu : mêmes rangées/plaques ---------- */
.nh h2,.snh h2,.hsh h3,.pe .gt,.pj-title{font-family:var(--font);color:var(--crimson)}
.nh h2,.hsh h3{
  display:inline-block;
  padding:5px 26px;
  border:2px solid var(--ink);
  border-radius:3px;
  background:var(--grain),linear-gradient(180deg,#f3eee1,#ddd5c0);
  box-shadow:inset 0 0 0 1px #fff7dd,0 2px 0 rgba(0,0,0,.4);
}
.nn,.ok,.ghost,.chip,.seg button,.hdel,.ca,.ac{
  font-family:var(--font);
  font-weight:600;
  color:var(--txt);
  border:1px solid #6f6757;
  border-radius:8px;
  background:linear-gradient(180deg,var(--sil1),var(--sil2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),2px 2px 0 rgba(40,30,15,.3);
}
.nn:hover,.ghost:hover,.chip:hover,.seg button:hover,.ca:hover,.ac:hover{
  border-color:var(--gold);
  color:var(--crimson);
  background:linear-gradient(180deg,#f9f7f1,#dbd7cc);
}
.ok{
  background:linear-gradient(180deg,var(--accent),var(--accent));
  border:1px solid var(--accent);
  color:#2a1c04;
}
.ok:hover{background:linear-gradient(180deg,var(--accent),var(--accent))}
.chip.on,.seg button.on{
  border:2px solid var(--gold);
  color:var(--crimson);
  background:linear-gradient(180deg,#f9f6ec,#e1dccc);
}
.ca,.ac{
  border-style:dashed;
  font-weight:500;
  color:var(--mut);
}
.hdel:hover,.hdel.arm,.cx:hover,.cx.arm,.cd:hover,.nx:hover,.sx:hover,.x:hover{
  background:rgba(var(--accent-rgb),.16);
  color:var(--crimson);
  border-color:var(--crimson);
}
.danger:hover{border-color:var(--crimson);color:var(--crimson)}
.del-note{
  background:#ead2cb;
  border:1px solid #8c3a2e;
  color:var(--crimson);
}
.del-note:hover{background:#e0bdb3}
.err{color:var(--crimson)}
/* colonnes + cartes (notes rapides) */
.col{
  background:rgba(236,231,216,.75);
  border:2px solid #4a3d29;
  border-radius:6px;
  box-shadow:inset 0 0 0 1px #f4eedc,3px 3px 0 rgba(40,30,15,.35);
}
.col.hot{background:rgba(var(--accent-rgb),.12);border-color:var(--gold)}
.cols .col.hot{outline:2px dashed var(--gold)}
.col.flash{border-color:var(--gold);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.5)}
.ch{
  border-bottom:1px dotted #7a6c52;
  margin:0 8px;
  padding:10px 2px 6px;
}
.cn{
  font-family:var(--font);
  color:var(--crimson);
  font-size:16px;
}
.cn:hover{border-color:var(--line)}
.cn:focus{background:#fbf7ec;border-color:var(--gold)}
.coldrag{background:linear-gradient(180deg,var(--sil1),var(--sil2));border-color:#6f6757}
.coldrag:hover{color:var(--crimson);border-color:var(--gold)}
.kc,.nc,.lb,.hrow,.tk,.hk{
  background:linear-gradient(180deg,#eeebe4,#d4d0c6);
  border:1px solid #6f6757;
  color:var(--txt);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),2px 2px 0 rgba(40,30,15,.3);
}
.kc:hover,.nc:hover,.tk:hover{border-color:var(--gold)}
.kc.src{opacity:.5}
.kc.gh{box-shadow:0 12px 30px rgba(0,0,0,.45)}
.lb{background:rgba(238,234,224,.9)}
.nd,.hint,.hnote,.cc{color:var(--mut)}
.empty{color:var(--mut)}
/* champs de saisie */
.modal textarea,.modal .ps,.hrow select,.hrow input[type=time],.pj-text{
  background:#f4eedf;
  color:var(--txt);
  border:1px solid #8b7f67;
  font-family:var(--font);
  color-scheme:light;
}
.modal textarea:focus,.modal .ps:focus,.pj-text:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pj-title:focus,.hrow .hn:focus{border-bottom-color:var(--gold)}
.lb textarea:focus{box-shadow:inset 0 -1px var(--gold)}
.dchip{
  background:linear-gradient(180deg,var(--sil1),var(--sil2));
  border-color:#6f6757;
  color:var(--txt);
}
.dchip.on{
  background:linear-gradient(180deg,var(--accent),var(--accent));
  border-color:var(--accent);
  color:#2a1c04;
}
input[type=checkbox]{accent-color:var(--accent)}
.tk input,.lb input[type=checkbox]{accent-color:var(--accent)}
.hk input{accent-color:#2e7d5a}
/* fenêtres, menu, toast : cadre parchemin */
.ov{background:rgba(20,6,3,.62)}
.modal{border-radius:4px;padding:18px}
.mh{color:var(--crimson);font-size:17px}
.menu button{color:var(--txt)}
/* ---------- Agenda ---------- */
.week{scrollbar-color:#8a7a5c #d8cfba}
.week::-webkit-scrollbar-track{background:#d8cfba}
.week::-webkit-scrollbar-thumb{background:#8a7a5c;border:3px solid #d8cfba}
.grid{
  background:rgba(238,233,219,.8);
  border:2px solid #4a3d29;
  border-radius:4px;
  box-shadow:inset 0 0 0 1px #f4eedc,3px 3px 0 rgba(40,30,15,.35);
}
.dh{color:var(--mut);border-left:1px solid var(--line)}
.dh b{color:var(--crimson)}
.dh.today b{
  background:linear-gradient(180deg,var(--accent),var(--accent));
  color:#2a1c04;
  border:1px solid var(--accent);
}
.hr{border-top:1px solid var(--line)}
.rl{border-top:1px solid var(--line)}
.tcell,.hcell,.fcell{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tcell{background:rgba(255,255,255,.12)}
.tcell.today,.hcell.today,.fcell.today{background:rgba(var(--accent-rgb),.16)}
.tcell .wa,.hcell .wa,.fcell .wa{
  background:linear-gradient(180deg,var(--sil1),var(--sil2));
  border:1px solid #6f6757;
  color:#4a3d29;
}
.tcell:hover .wa,.tcell .wa:focus-visible,.hcell:hover .wa,.hcell .wa:focus-visible,.fcell:hover .wa,.fcell .wa:focus-visible{border-color:var(--gold);color:var(--crimson)}
.ev{
  background:rgba(52,78,138,.2);
  border:1px solid #34508a;
  box-shadow:1px 1px 0 rgba(40,30,15,.3);
}
.ev:hover{background:rgba(52,78,138,.32)}
.ev.dt{background:rgba(46,125,90,.22);border-color:#2e7d5a}
.ev.dt:hover{background:rgba(46,125,90,.34)}
.ev.pt{background:rgba(var(--accent-rgb),.26);border-color:var(--accent)}
.ev.pt:hover{background:rgba(var(--accent-rgb),.4)}
.ev.dt .dtl input{accent-color:#2e7d5a}
.ev.pt .dtl input{accent-color:var(--accent)}
.hr.tl,.rl:not(.busy),.ev,.tk .tt,.hk .tt,.rl.busy{color:var(--txt)}
.ev small,.tk small,.hcnt{color:var(--mut)}
.fsb{color:var(--mut)}
.fsb:hover{color:var(--crimson)}
.hk.done .tt,.tk.done .tt,.ev.dt.done b,.ev.pt.done b,.lb.done textarea{color:var(--mut)}
@media(max-width:600px){
  main{padding:5px;gap:5px}
}
/* ===== Mêmes barres qu'en v64, mais à la largeur de la barre latérale ===== */
body>.row{
  flex:0 0 auto;
  width:100%;
  min-width:0;
}
body>.row:first-child{flex-basis:54px}
body>.row.subrow{flex-basis:54px}
body>.row .bar{min-width:0;overflow:hidden}
#titles .label,#subs .label{
  padding:0 6px;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
}
#titles .tab,#subs .tab{padding:6px 4px;min-width:0}
body>.row .add{flex:0 0 36px;font-size:22px}
body>.row .add.empty{flex:1}
body>.row .x{
  right:2px;
  width:16px;
  height:16px;
  font-size:13px;
}
/* les boutons × et + des barres ne prennent pas le style « bouton argenté » de la barre latérale */
body>.row .bar .tab .x{
  display:none;
  position:absolute;
  right:2px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  min-width:0;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  box-shadow:none;
  align-items:center;
  justify-content:center;
  font-size:13px;
  line-height:1;
  color:#000;
}
body>.row .bar .tab:hover .x{display:flex}
body>.row .bar .x:hover{background:rgba(var(--accent-rgb),.25)}
body>.row .bar .add{
  display:flex;
  align-items:center;
  justify-content:center;
  height:auto;
  min-width:0;
  padding:0;
  border:0;
  border-left:1px solid rgba(12,6,2,.65);
  border-radius:0;
  background:transparent;
  box-shadow:none;
  color:#fff;
  font-size:22px;
  font-weight:400;
}
body>.row .bar .add:hover{
  background:rgba(255,226,166,.12);
  color:#fff;
  border-color:rgba(12,6,2,.65);
}
body>.row .bar .add.empty{
  gap:6px;
  font-size:13px;
  font-weight:600;
}
body>.row .bar .tab{box-shadow:none}
/* ===== Option : petite barre (dans la barre latérale), identique à la v67 ===== */
body>.row{font-family:Quicksand,"Segoe UI",system-ui,sans-serif}
/* Barre supérieure en bois sombre, grain et séparateurs inspirés de la capture. */
body>.row:first-child{
  height:60px;
  min-height:60px;
  flex:0 0 60px;
  position:relative;
  z-index:2;
  background-color:#3b190f;
  background-image:linear-gradient(180deg,rgba(0,0,0,.18),rgba(10,4,2,.05) 52%,rgba(0,0,0,.3)),var(--wood-texture);
  background-size:auto,260px 72px;
}
body>.row:first-child>.bar#titles{
  background:transparent;
  min-height:0;
  align-items:stretch;
}
/* Rangée des sous-sections : un ruban plus discret sur le même papier. */
@media(max-width:600px){
  body>.row:first-child{
    height:52px;
    min-height:52px;
    flex-basis:52px;
  }
  body>.row.subrow,#subs.bar.sub{
    height:38px;
    min-height:38px;
    flex-basis:38px;
  }
}
/* ===== 2e barre = même bois et même plaque que la 1re ===== */
body>.row.subrow{
  height:60px;
  min-height:60px;
  flex:0 0 60px;
  position:relative;
  z-index:1;
  background-color:#3b190f;
  background-image:linear-gradient(180deg,rgba(0,0,0,.18),rgba(10,4,2,.05) 52%,rgba(0,0,0,.3)),var(--wood-texture);
  background-size:auto,260px 72px;
}
body>.row.subrow>#subs.bar.sub{
  background:transparent;
  height:auto;
  min-height:0;
  align-items:stretch;
}
@media(max-width:600px){
  body>.row.subrow{
    height:46px;
    min-height:46px;
    flex-basis:46px;
  }
}
/* trait entre les 2 barres : noir uni */
body>.row:first-child{border-bottom:3px solid #000;box-shadow:inset 0 2px 2px rgba(0,0,0,.7)}
/* bas de la 2e barre : aucun trait */
body>.row.subrow{border-bottom:0;box-shadow:inset 0 2px 2px rgba(0,0,0,.7)}
/* séparateurs et plaque active sans reflet jaune */
#titles .tab::before,#subs .tab::before{box-shadow:none}
/* ===== CENTRE : style « parchemin » repris de la v48 ===== */
#content{
  --bg:#e8e0d0;
  --bar:#3f1b11;
  --bar2:#5a2b1c;
  --line:#a99b85;
  --txt:#2c251d;
  --mut:#4a3d29;
  --acc:var(--accent);
  font-family:Quicksand,"Segoe UI",system-ui,sans-serif;
  font-size:15px;
  color:var(--txt);
  background-color:#e6dfd0;
  background-image:linear-gradient(rgba(241,236,224,.18),rgba(224,216,200,.14)),var(--paper-texture);
  background-repeat:repeat;
  background-size:auto,420px 130px;
  background-position:0 0;
  border:2px solid #0c0502;
  border-radius:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
#content .week,#content .view,#content .notes,#content .kb,#content .pe{background:transparent}
#content input,#content textarea,#content select{color-scheme:light}
/* neutralise le thème « shogun » dans le centre */
#content .nh h2,#content .hsh h3{
  display:block;

  height:230px;
  margin:-115px 0 0 -115px;
  pointer-events:none;
}

/* ==========================================================================

<body>
<div class="row"><div class="bar" id="titles"></div></div><div class="row subrow"><div class="bar sub" id="subs"></div></div>
<main><aside class="side" id="side"><div id="sidebody"></div><div class="navio"><button class="io" id="imp" title="Restaurer une sauvegarde (.json)">Importer</button><button class="io" id="exp" title="Sauvegarder tout (.json)">Exporter</button><button class="io" id="opt" title="Options">Options</button></div></aside><section id="content"></section><aside class="side rightside" id="rightside"><div id="rightbody"></div></aside></main>

<script>
const KEY='planning-v2';
const uid=()=>Math.random().toString(36).slice(2,8);
const mk=(n)=>({id:uid(),name:n});
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>new Date(t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const defCols=()=>[mk('À faire'),mk('En cours'),mk('Terminé')];
// 1er clic : demande confirmation ; 2e clic (sous 3 s) : renvoie true
function confirmClick(b,ask){
  if(b._on)return true;
  const base=b.textContent;b._on=true;b.textContent=ask;b.classList.add('arm');
  setTimeout(()=>{b._on=false;b.textContent=base;b.classList.remove('arm')},3000);
  return false;
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tabs||!S.tabs.length){
  const a=mk('Agenda'),c=mk('Classeur');
  a.subs=[{id:uid(),name:'Semaine',kind:'week'}];
  c.subs=[];
  S={tabs:[a,c],active:a.id,sub:{}};
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const MOD_TABS={agenda:{name:'Agenda',subs:[['Semaine','week']]},classeur:{name:'Classeur',subs:[['Notes rapides','notes'],['Projet','projects'],['Habitudes','habits']]},projet:{name:'Projet',subs:[['Projet','projects']]},sidebar:{name:'Sidebar',subs:[]}};
const MOD_SUBS={week:'Semaine',notes:'Notes rapides',projects:'Projet',habits:'Habitudes'};
const hasSub=k=>S.tabs.some(x=>x.subs.some(s=>s.kind===k));
const curTab=()=>S.tabs.find(t=>t.id===S.active)||S.tabs[0];
const ensureCols=()=>{if(!Array.isArray(S.cols)||!S.cols.length)S.cols=defCols()};
const ensureVrac=()=>{if(!S.projects.some(p=>p.id==='vrac'))S.projects.unshift({id:'vrac',name:'Vrac',text:'',t:Date.now()});else{const i=S.projects.findIndex(p=>p.id==='vrac');if(i>0)S.projects.unshift(...S.projects.splice(i,1))}};
const pOf=n=>S.projects.some(p=>p.id===n.p)?n.p:'vrac';
const curQ=()=>S.projects.some(p=>p.id===S.qnProj)?S.qnProj:'vrac';
const spaces=()=>S.tabs.flatMap(t=>t.subs.filter(x=>x.kind==='projects'));
const spOf=p=>{const L=spaces();return L.some(x=>x.id===p.sp)?p.sp:(L[0]?L[0].id:null)};
const SP=()=>{const t=curTab(),c=t.subs.find(x=>x.id===S.sub[t.id]);return c&&c.kind==='projects'?c:spaces()[0]};
const migSp=()=>{const s0=spaces()[0];if(s0){if(s0.op===undefined&&S.openProj!==undefined){s0.op=S.openProj;s0.pv=S.projView}S.projects.forEach(p=>{if(!p.sp)p.sp=s0.id})}delete S.openProj;delete S.projView};
// Migrations des anciennes sauvegardes (ordre important)
function migrate(){
  S.notes=S.notes||[];S.sub=S.sub||{};
  if(!S.qnInit){S.qnInit=true;const c=S.tabs.find(x=>x.name==='Classeur')||S.tabs[S.tabs.length-1];const n={id:uid(),name:'Notes rapides',kind:'notes'};c.subs.unshift(n);S.sub[c.id]=n.id}
  if(!S.sbInit){S.sbInit=true;S.tabs.push({id:uid(),name:'Sidebar',kind:'sidebar',subs:[]})}
  if(!S.modInit){S.modInit=true;S.tabs.forEach(t=>{if(!t.kind){if(t.name==='Agenda')t.kind='agenda';else if(t.name==='Classeur')t.kind='classeur'}})}
  S.projects=S.projects||[];
  S.events=Array.isArray(S.events)?S.events:[];
  S.tasks=Array.isArray(S.tasks)?S.tasks:[];
  ensureCols();
  ensureVrac();
  if(!S.projInit){S.projInit=true;if(!hasSub('projects')){const c=S.tabs.find(x=>x.kind==='classeur'||x.name==='Classeur');if(c)c.subs.push({id:uid(),name:'Projet',kind:'projects'})}}
  S.habits=Array.isArray(S.habits)?S.habits:[];
  S.dtasks=Array.isArray(S.dtasks)?S.dtasks:[];
  S.ptasks=Array.isArray(S.ptasks)?S.ptasks:[];
  S.pocc=Array.isArray(S.pocc)?S.pocc:[];
  S.checks=(S.checks&&typeof S.checks==='object'&&!Array.isArray(S.checks))?S.checks:{};
  if(!S.habInit){S.habInit=true;if(!hasSub('habits')){const c=S.tabs.find(x=>x.kind==='classeur'||x.name==='Classeur');if(c)c.subs.push({id:uid(),name:'Habitudes',kind:'habits'})}}
  migSp();
}
migrate();

function bar(el,items,activeId,o){
  el.innerHTML='';
  let from=null;
  items.forEach((it,i)=>{
    const t=document.createElement('div');
    t.className='tab'+(it.id===activeId?' active':'');
    t.draggable=true;
    const l=document.createElement('span');
    l.className='label';l.textContent=it.name;
    t.appendChild(l);
    if(items.length>1){
      const x=document.createElement('button');
      x.className='x';x.textContent='×';x.title='Supprimer';
      x.onclick=e=>{e.stopPropagation();o.remove(i)};
      t.appendChild(x);
    }
    t.onclick=()=>{if(l.isContentEditable||t.classList.contains('active'))return;el.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n===t));o.select(it.id)};
    t.ondblclick=e=>{
      e.preventDefault();
      t.draggable=false;l.contentEditable='true';l.focus();
      const r=document.createRange();r.selectNodeContents(l);
      const s=getSelection();s.removeAllRanges();s.addRange(r);
    };
    const done=ok=>{
      if(!l.isContentEditable)return;
      const v=l.textContent.trim();
      l.contentEditable='false';t.draggable=true;
      if(ok&&v)it.name=v;
      l.textContent=it.name;save();
    };
    l.onkeydown=e=>{
      if(e.key==='Enter'){e.preventDefault();done(true)}
      if(e.key==='Escape'){done(false)}
    };
    l.onblur=()=>done(true);
    t.ondragstart=e=>{from=i;t.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))};
    t.ondragend=()=>{t.classList.remove('drag');el.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))};
    t.ondragover=e=>{e.preventDefault();t.classList.add('over')};
    t.ondragleave=()=>t.classList.remove('over');
    t.ondrop=e=>{
      e.preventDefault();
      if(from===null||from===i)return;
      const [m]=items.splice(from,1);items.splice(i,0,m);
      from=null;save();render();
    };
    el.appendChild(t);
  });
  const a=document.createElement('button');
  a.className='add';a.title='Ajouter';a.onclick=o.add;
  if(!items.length&&o.empty){a.className='add empty';a.innerHTML='<b>+</b><span>'+o.empty+'</span>'}else a.textContent='+';
  el.appendChild(a);
}

function render(){
  const t=curTab();S.active=t.id;
  bar(document.getElementById('titles'),S.tabs,t.id,{
    select:id=>{S.active=id;save();renderSubs()},
    add:e=>{
      const mkTab=(name,kind)=>{
        let mv=null;
        if(kind==='projet'){const nP=S.tabs.filter(x=>x.kind==='projet').length;if(nP)name='Projet '+(nP+1);else S.tabs.forEach(x=>{x.subs=x.subs.filter(y=>{if(y.kind==='projects'&&!mv){mv=y;return false}return true})})}
        const subs=[];
        if(kind&&MOD_TABS[kind])MOD_TABS[kind].subs.forEach(([n,k])=>{if(mv&&k==='projects')subs.push(mv);else if(kind==='projet'||!hasSub(k))subs.push({id:uid(),name:n,kind:k})});
        const n={id:uid(),name,kind,subs};S.tabs.push(n);S.active=n.id;
        if(subs[0])S.sub[n.id]=subs[0].id;
        save();render();
      };
      const miss=Object.entries(MOD_TABS).filter(([k])=>k==='projet'||!S.tabs.some(x=>x.kind===k));
      if(!miss.length)mkTab('Nouveau');
      else menu(e.currentTarget,[...miss.map(([k,m])=>[m.name,()=>mkTab(m.name,k)]),['Titre vide',()=>mkTab('Nouveau')]]);
    },
    remove:i=>{S.tabs.splice(i,1);save();render()}
  });
  renderSubs();
}
function renderSubs(){
  const t=curTab();
  if(!S.sub[t.id]||!t.subs.find(s=>s.id===S.sub[t.id]))S.sub[t.id]=t.subs[0]&&t.subs[0].id;
  bar(document.getElementById('subs'),t.subs,S.sub[t.id],{
    select:id=>{S.sub[t.id]=id;save();renderContent()},
    empty:'Nouveau dossier',
    add:e=>{
      const mkSub=(name,kind)=>{if(kind==='projects'&&spaces().length)name='Projet '+(spaces().length+1);const n={id:uid(),name,kind};t.subs.push(n);S.sub[t.id]=n.id;save();render()};
      const miss=Object.entries(MOD_SUBS).filter(([k])=>k==='projects'||!hasSub(k));
      if(!miss.length)mkSub('Nouveau dossier');
      else menu(e.currentTarget,[...miss.map(([k,n])=>[n,()=>mkSub(n,k)]),['Dossier vide',()=>mkSub('Nouveau dossier')]]);
    },
    remove:i=>{t.subs.splice(i,1);save();render()}
  });
  save();renderContent();
}
const SV=p=>`<svg viewBox='0 0 24 24'>${p}</svg>`;
const IC={tog:SV(`<rect x='3' y='4' width='18' height='16' rx='2'/><path d='M9 4v16'/>`),cal:SV(`<rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/>`),chk:SV(`<rect x='3' y='3' width='18' height='18' rx='3'/><path d='M8 12l3 3 5-6'/>`),bell:SV(`<path d='M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4'/>`)};

IC.eye=SV(`<path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/>`);
IC.eyeoff=SV(`<path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/><path d='M3 3l18 18'/>`);

function renderSide(){
  const sa=document.getElementById('side'),sd=document.getElementById('sidebody');
  const t=curTab(),cs=t.subs.find(x=>x.id===S.sub[t.id]),inQn=!!cs&&cs.kind==='notes',inProj=!!cs&&cs.kind==='projects';

function startDrag(e,card,m){
  if((e.pointerType==='mouse'&&e.button!==0)||e.target.closest('.nx'))return;
  const touch=e.pointerType!=='mouse',sx=e.clientX,sy=e.clientY,box=m.querySelector('.cols');
  let on=false,gh=null,px=sx,py=sy,ox=0,oy=0,timer=0,as=0;
  const place=()=>{
    const el=document.elementFromPoint(px,py),col=el&&el.closest('.col');
    m.querySelectorAll('.col.hot').forEach(c=>c.classList.remove('hot'));
    if(!col)return;
    col.classList.add('hot');
    const list=col.querySelector('.cl');
    const at=[...list.querySelectorAll('.kc')].filter(c=>c!==card).find(c=>{const r=c.getBoundingClientRect();return py<r.top+r.height/2})||null;
    if(card.parentNode!==list||card.nextElementSibling!==at)list.insertBefore(card,at);
  };
  const move=()=>{gh.style.left=(px-ox)+'px';gh.style.top=(py-oy)+'px';place()};
  const tick=()=>{
    const cr=box.getBoundingClientRect();let ch=false;
    if(px<cr.left+50){box.scrollLeft-=14;ch=true}else if(px>cr.right-50){box.scrollLeft+=14;ch=true}
    const hot=m.querySelector('.col.hot .cl');
    if(hot){const lr=hot.getBoundingClientRect();if(py<lr.top+36){hot.scrollTop-=10;ch=true}else if(py>lr.bottom-36){hot.scrollTop+=10;ch=true}}
    if(ch)place();
  };
  const go=()=>{
    on=true;clearTimeout(timer);
    const r=card.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
    gh=card.cloneNode(true);gh.className='kc gh';gh.style.width=r.width+'px';
    document.body.appendChild(gh);
    card.classList.add('src');document.body.classList.add('dragging');
    move();as=setInterval(tick,16);
    if(touch&&navigator.vibrate)navigator.vibrate(15);
  };
  const pm=ev=>{
    px=ev.clientX;py=ev.clientY;
    if(!on){
      const d=Math.hypot(px-sx,py-sy);
      if(touch){if(d>8)cleanup()}else if(d>5)go();
      return;
    }
    move();
  };
  const tm=ev=>{if(on&&ev.cancelable)ev.preventDefault()};
  const cleanup=()=>{
    clearTimeout(timer);clearInterval(as);
    document.removeEventListener('pointermove',pm);
    document.removeEventListener('pointerup',pu);
    document.removeEventListener('pointercancel',pc);
    document.removeEventListener('touchmove',tm);
    if(gh)gh.remove();
    document.body.classList.remove('dragging');
    card.classList.remove('src');
    m.querySelectorAll('.col.hot').forEach(c=>c.classList.remove('hot'));
  };
  const pu=()=>{
    if(!on){cleanup();return}
    const n=S.notes.find(x=>x.id===card.dataset.id),col=card.closest('.col'),after=card.nextElementSibling;
    cleanup();
    if(n&&col){
      S.notes=S.notes.filter(x=>x!==n);
      n.c=col.dataset.id;
      const at=after&&after.classList.contains('kc')?S.notes.findIndex(x=>x.id===after.dataset.id):-1;
      if(at>=0)S.notes.splice(at,0,n);else S.notes.push(n);
      save();
    }
    lastDrag=Date.now();
    renderContent();
  };
  const pc=()=>{const was=on;cleanup();if(was)renderContent()};
  document.addEventListener('pointermove',pm);
  document.addEventListener('pointerup',pu);
  document.addEventListener('pointercancel',pc);
  document.addEventListener('touchmove',tm,{passive:false});
  if(touch){try{card.releasePointerCapture(e.pointerId)}catch(_){}timer=setTimeout(go,320)}
}

// Nettoyage : seules quelques balises et la couleur du texte sont conservées (sauvegardes importées, collages…)
function cleanHtml(h){
  const OK=new Set(['B','STRONG','I','EM','U','H2','H3','P','DIV','BR','SPAN','A']);
  const col=v=>/^(#[0-9a-f]{3,8}|rgba?\([\d\s,.%]+\))$/i.test((v||'').trim())?v.trim():'';
  const t=document.createElement('template');t.innerHTML=String(h||'');
  const walk=n=>{
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===3)return;
      if(c.nodeType!==1){c.remove();return}
      const tag=c.tagName;
      if(tag==='SCRIPT'||tag==='STYLE'||tag==='IFRAME'||tag==='OBJECT'||tag==='EMBED'||tag==='SVG'||tag==='MATH'){c.remove();return}
      walk(c);
      const color=col(tag==='FONT'?c.getAttribute('color'):(c.style&&c.style.color));
      if(tag==='FONT'||(tag==='SPAN')){
        const sp=document.createElement('span');
        while(c.firstChild)sp.appendChild(c.firstChild);
        if(color){sp.style.color=color;n.replaceChild(sp,c)}
        else{while(sp.firstChild)n.insertBefore(sp.firstChild,c);c.remove()}
        return;
      }
      if(!OK.has(tag)){while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove();return}
      const href=tag==='A'?c.getAttribute('href'):'';
      [...c.attributes].forEach(a=>c.removeAttribute(a.name));
      if(tag==='A' && /^https?:\/\//i.test(href||'')){c.setAttribute('href',href);c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer')}
      if(color&&tag!=='BR')c.style.color=color;
    });
  };
  walk(t.content);
  // Détecte aussi les URL dans le contenu déjà enregistré, au chargement de chaque note.
  // Ainsi, pas besoin d'entrer dans l'édition puis de quitter la note pour activer les liens.
  const walker=document.createTreeWalker(t.content,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()){
    const node=walker.currentNode;
    if(/https?:\/\//i.test(node.nodeValue||'') && !(node.parentElement&&node.parentElement.closest('a'))) nodes.push(node);
  }
  nodes.forEach(node=>{
    const re=/https?:\/\/[^\s<>"']+/gi,txt=node.nodeValue,frag=document.createDocumentFragment();
    let last=0,m;
    while((m=re.exec(txt))){
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const raw=m[0];let url=raw;
      while(/[.,!?;:)\]]$/.test(url))url=url.slice(0,-1);
      if(url){
        const a=document.createElement('a');a.href=url;a.textContent=url;a.target='_blank';a.rel='noopener noreferrer';
        a.style.textDecoration='underline';a.style.cursor='pointer';
        frag.appendChild(a);
        if(url.length<raw.length)frag.appendChild(document.createTextNode(raw.slice(url.length)));
      } else frag.appendChild(document.createTextNode(raw));
      last=m.index+raw.length;
    }
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  return t.innerHTML;
}
// Lie un éditeur riche (zone b + barre tb) à une note : utilisé par la carte et par la vue en grand
function bindRich(it,b,tb,busy){

  b.oninput=sync;
  let renamingPastedLink=false;
  // Transforme les URL en liens cliquables quand on quitte la note.
  b.onblur=()=>{
    if(renamingPastedLink)return;
    const walker=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);const nodes=[];
    while(walker.nextNode())if(/https?:\/\//i.test(walker.currentNode.nodeValue||'')&&!walker.currentNode.parentElement.closest('a'))nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const re=/https?:\/\/[^\s<>"']+/gi,txt=node.nodeValue,frag=document.createDocumentFragment();let last=0,m;
      while((m=re.exec(txt))){if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));let raw=m[0],url=raw;while(/[.,!?;:)\]]$/.test(url))url=url.slice(0,-1);if(url){const a=document.createElement('a');a.href=url;a.textContent=url;a.target='_blank';a.rel='noopener noreferrer';frag.appendChild(a);if(url.length<raw.length)frag.appendChild(document.createTextNode(raw.slice(url.length)))}else frag.appendChild(document.createTextNode(raw));last=m.index+raw.length;}
      if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));node.parentNode.replaceChild(frag,node);
    });sync();
  };
  b.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a){e.preventDefault();window.open(a.href,'_blank','noopener,noreferrer')}});
  const getYouTubeVideoTitle=async url=>{
    try{
      const u=new URL(url);
      const host=u.hostname.replace(/^www\./,'').replace(/^m\./,'');
      if(!['youtube.com','youtu.be','youtube-nocookie.com'].includes(host)&&!host.endsWith('.youtube.com'))return '';
      const response=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(url));
      if(!response.ok)return '';
      const data=await response.json();
      return typeof data.title==='string'?data.title.trim():'';
    }catch{return ''}
  };
  b.onpaste=async e=>{
    const tx=(e.clipboardData||window.clipboardData).getData('text/plain');
    if(!tx)return;
    e.preventDefault();
    const urls=tx.match(/https?:\/\/[^\s<>\"']+/gi)||[];
    const cleanUrl=value=>value.replace(/[.,!?;:)\]]+$/,'');
    const singleUrl=urls.length===1&&tx.trim()===cleanUrl(urls[0]);
    const sel=window.getSelection();
    let range=null;
    if(sel&&sel.rangeCount){range=sel.getRangeAt(0).cloneRange();if(!b.contains(range.commonAncestorContainer))range=null;}
    if(!range){range=document.createRange();range.selectNodeContents(b);range.collapse(false);}
    if(singleUrl){
      const url=cleanUrl(urls[0]);
      let suggestion='Lien';
      try{
        const u=new URL(url),parts=u.pathname.split('/').filter(Boolean);let slug='';
        const dp=parts.findIndex(x=>/^dp$/i.test(x));if(dp>0)slug=parts[dp-1];
        if(!slug){const pr=parts.findIndex(x=>/^product$/i.test(x));if(pr>0)slug=parts[pr-1];}
        if(!slug)slug=parts.find(x=>/[-_]/.test(x))||parts[0]||'';
        try{slug=decodeURIComponent(slug)}catch{}
        const words=slug.replace(/[+_]+/g,'-').split('-').map(x=>x.trim()).filter(Boolean);
        if(words.length)suggestion=words.slice(0,2).join('-').replace(/[^\p{L}\p{N}-]/gu,'')||'Lien';
      }catch{}
      const videoTitle=await getYouTubeVideoTitle(url);
      if(videoTitle)suggestion=videoTitle;
      renamingPastedLink=true;
      let label;
      try{label=window.prompt('Renommer le lien ?\nNom proposé (modifiable) :',suggestion)}
      finally{renamingPastedLink=false}
      const finalLabel=(label===null||!label.trim())?url:label.trim();
      b.focus();
      if(sel){sel.removeAllRanges();sel.addRange(range)}
      range.deleteContents();
      const a=document.createElement('a');a.href=url;a.textContent=finalLabel;a.target='_blank';a.rel='noopener noreferrer';a.style.textDecoration='underline';a.style.cursor='pointer';
      range.insertNode(a);
      const after=document.createRange();after.setStartAfter(a);after.collapse(true);
      if(sel){sel.removeAllRanges();sel.addRange(after)}
    }else{
      // Pour un collage de texte ordinaire ou de plusieurs URL, conserver les retours à la ligne.
      const frag=document.createDocumentFragment();
      const re=/https?:\/\/[^\s<>\"']+/gi;let last=0,m;
      while((m=re.exec(tx))){if(m.index>last)appendTextWithBreaks(frag,tx.slice(last,m.index));const raw=m[0],u=cleanUrl(raw);const a=document.createElement('a');a.href=u;a.textContent=u;a.target='_blank';a.rel='noopener noreferrer';a.style.textDecoration='underline';a.style.cursor='pointer';frag.appendChild(a);if(raw.length>u.length)appendTextWithBreaks(frag,raw.slice(u.length));last=re.lastIndex;}
      appendTextWithBreaks(frag,tx.slice(last));range.deleteContents();range.insertNode(frag);
    }
    sync();
  };
  function appendTextWithBreaks(parent,text){text.split('\n').forEach((part,i)=>{if(i)parent.appendChild(document.createElement('br'));if(part)parent.appendChild(document.createTextNode(part));});}
  b.ondrop=e=>{e.preventDefault();if(busy&&busy())return;const tx=e.dataTransfer&&e.dataTransfer.getData('text/plain');if(tx){b.focus();document.execCommand('insertText',false,tx)}};
  tb.onmousedown=e=>e.preventDefault();
  tb.querySelectorAll('[data-cmd]').forEach(x=>x.onclick=()=>{b.focus();document.execCommand(x.dataset.cmd);sync()});
  tb.querySelectorAll('[data-blk]').forEach(x=>x.onclick=()=>{b.focus();document.execCommand('formatBlock',false,'<'+x.dataset.blk+'>');sync()});
  tb.querySelectorAll('[data-col]').forEach(x=>x.onclick=()=>{b.focus();document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,x.dataset.col||NOTE_INK);document.execCommand('styleWithCSS',false,false);sync()});
}

  const ti=m.querySelector('.pj-title'),ta=m.querySelector('.pj-text'),del=m.querySelector('.pj-del');
  // Les liens renommés sont conservés dans le texte sous la forme [nom](URL).
  const serializeProjectText=()=>{
    // Sérialiser le DOM explicitement : innerText ne conserve pas toujours les <br>

      if(node.nodeType===Node.TEXT_NODE)return (node.nodeValue||'').replace(/\u00a0/g,' ');
      if(node.nodeType!==Node.ELEMENT_NODE)return '';

      return out;
    };

  };
  const linkHtml=(label,url)=>`<a href="${escH(url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;cursor:pointer">${escH(label)}</a>`;

      const re=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>\"']+)/gi;
      let out='',last=0,match;
      while((match=re.exec(line))){
        out+=escH(line.slice(last,match.index));
        if(match[2]) out+=linkHtml(match[1],match[2]);
        else {let u=match[3];while(/[.,!?;:)\]]$/.test(u))u=u.slice(0,-1);out+=linkHtml(u,u)+escH(match[3].slice(u.length));}
        last=re.lastIndex;
      }
      return out+escH(line.slice(last));
    }).join('<br>');
  };

    try{
      const u=new URL(url);
      const parts=u.pathname.split('/').filter(Boolean);
      let slug='';
      // Amazon utilise plusieurs formats d'URL : /slug/dp/ASIN, /gp/product/ASIN…
      const dp=parts.findIndex(x=>/^dp$/i.test(x));
      if(dp>0) slug=parts[dp-1];
      if(!slug){
        const product=parts.findIndex(x=>/^product$/i.test(x));
        if(product>0) slug=parts[product-1];
      }
      if(!slug) slug=parts.find(x=>/[-_]/.test(x))||parts[0]||'';
      try{slug=decodeURIComponent(slug)}catch{}
      const words=slug.replace(/[+_]+/g,'-').split('-').map(x=>x.trim()).filter(Boolean);

  ta.oninput=()=>{p.text=serializeProjectText();p.t=Date.now();save()};
  // Quand une URL est collée, la transforme tout de suite en lien cliquable,
  // sans attendre la sortie de la note ni un rafraîchissement de la page.
  // Pendant le renommage, ne pas reconstruire le contenu sur blur : cela
  // détruisait le nœud/Range mémorisé et envoyait le lien en fin de note.
  let renamingPastedLink=false;

    const cleanUrl=value=>value.replace(/[.,!?;:)\]]+$/,'');
    const singleUrl=urls.length===1 && tx.trim()===cleanUrl(urls[0]);
    const url=singleUrl?cleanUrl(urls[0]):null;
    const sel=window.getSelection();
    let range=null;
    if(sel&&sel.rangeCount){

      if(!ta.contains(range.commonAncestorContainer))range=null;
    }

      // prompt() provoque le blur de l'éditeur. Bloquer son rendu de blur pour
      // conserver le DOM exact sur lequel la Range capturée pointe.
      let suggestion=suggestedLinkName(url);
      const videoTitle=await getYouTubeVideoTitle(url);
      if(videoTitle)suggestion=videoTitle;
      renamingPastedLink=true;
      let label;
      try { label=window.prompt('Renommer le lien ?\nNom proposé (modifiable) :',suggestion); }
      finally { renamingPastedLink=false; }
      const finalLabel=(label===null||!label.trim())?url:label.trim();
      // La Range est toujours valide : le blur n'a pas remplacé le contenu.
      ta.focus();
      const currentSel=window.getSelection();
      if(currentSel){
        currentSel.removeAllRanges();
        currentSel.addRange(range);
      }
      range.deleteContents();
      const a=document.createElement('a');
      a.href=url;a.target='_blank';a.rel='noopener noreferrer';
      a.style.textDecoration='underline';a.style.cursor='pointer';a.textContent=finalLabel;
      range.insertNode(a);

      if(currentSel){currentSel.removeAllRanges();currentSel.addRange(after)}

      let last=0,match;
      while((match=re.exec(tx))){
        frag.appendChild(document.createTextNode(tx.slice(last,match.index)));

        if(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.style.textDecoration='underline';a.style.cursor='pointer';a.textContent=u;frag.appendChild(a);if(raw.length>u.length)frag.appendChild(document.createTextNode(raw.slice(u.length)));}

      }
      frag.appendChild(document.createTextNode(tx.slice(last)));

      });

  });

}

const WK_H0=8,WK_H1=20;
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtHM=min=>(Math.floor(min/60)%24)+'h'+(min%60?String(min%60).padStart(2,'0'):'');
const fmtDur=min=>min<60?min+' min':Math.floor(min/60)+' h'+(min%60?' '+(min%60):'');
const WDL=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],WD1=['L','M','M','J','V','S','D'];

const weekKeys=(off=WEEK_OFF)=>{const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()+6)%7+7*off);return WDL.map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return dayKey(d)})};
// Une journée va de 4h à 3h le lendemain (3h–4h = coupure) ; les heures 0h–3h59 saisies comptent comme la nuit de la veille.
const DAY_START=4*60,DAY_END=27*60,DEF_START=8*60;
const shiftKey=(key,n)=>{const [Y,M,Dn]=key.split('-').map(Number);return dayKey(new Date(Y,M-1,Dn+n))};
const fmtT=n=>String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const parseT=v=>{const r=/^(\d{1,2}):(\d{2})/.exec(v||'');return r?(+r[1])*60+(+r[2]):NaN};

const place=(x,s,e)=>{x.h=Math.floor(s/60);x.m=s%60;x.dur=e-s};
const fmtRange=x=>fmtHM(startOf(x))+'–'+fmtHM(startOf(x)+x.dur);
const overlap=(a,b)=>a.s<b.e&&b.s<a.e;
// Tâches qui COMMENCENT un jour donné (minutes depuis 0h de ce jour ; la fin peut dépasser minuit)
function itemsFor(key){
  const wd=wdOf(key);
  return [
    ...S.events.filter(e=>e.d===key&&S.projects.some(p=>p.id===e.p)).map(o=>({k:'ev',o})),
    ...S.dtasks.filter(t=>t.days.includes(wd)).map(o=>({k:'dt',o})),
    ...S.pocc.filter(o=>o.d===key&&S.ptasks.some(t=>t.id===o.tid)).map(o=>({k:'pt',o}))
  ].map(x=>({...x,s:startOf(x.o),e:startOf(x.o)+x.o.dur}));
}
// Parties affichées ce jour-là : la tâche (coupée à 3h) + la suite des tâches de la veille (de 4h jusqu'à leur fin)
function dayParts(key,skip){
  const parts=[],prev=shiftKey(key,-1);
  itemsFor(key).forEach(x=>{
    if(x.o===skip)return;
    const e=Math.min(x.e,DAY_END);
    if(x.s<e)parts.push({...x,e,contIn:false,contOut:x.e-1440>DAY_START,origin:key,tag:'a'});
  });
  itemsFor(prev).forEach(x=>{
    if(x.o===skip)return;
    const e=Math.min(x.e-1440,DAY_END);
    if(e>DAY_START)parts.push({...x,s:DAY_START,e,contIn:true,contOut:false,origin:prev,tag:'b'});
  });

const slotsOf=(key,skip)=>dayParts(key,skip).map(p=>({s:p.s,e:p.e}));
// Conflit d'un créneau [s,e) commençant le jour `key` (y compris sa suite le lendemain)
function conflictsOn(key,s,e,skip){
  if(slotsOf(key,skip).some(x=>overlap({s,e:Math.min(e,DAY_END)},x)))return true;
  const sp=e-1440;
  return sp>DAY_START&&slotsOf(shiftKey(key,1),skip).some(x=>overlap({s:DAY_START,e:Math.min(sp,DAY_END)},x));
}
const slotConflict=(wd,s,e,skip)=>conflictsOn(weekKeys()[wd],s,e,skip);
const limitEnd=(key,s,skip)=>Math.min(DAY_END,...slotsOf(key,skip).filter(x=>x.s>s).map(x=>x.s));
const defEnd=(key,s,skip,len)=>Math.min(s+(len||60),limitEnd(key,s,skip));
const setCheck=(id,k,v)=>{if(v)S.checks[id+'|'+k]=1;else delete S.checks[id+'|'+k];save()};
const segHtml=a=>`<div class='seg'><button type='button' class='${a==='ev'?'on':''}' data-t='ev'>Projet</button><button type='button' class='${a==='dt'?'on':''}' data-t='dt'>Tâche quotidienne</button><button type='button' class='${a==='pt'?'on':''}' data-t='pt'>Tâche ponctuelle</button></div>`;
const bindSeg=(o,key,h,pre)=>o.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>b.dataset.t==='dt'?dtDialog(null,key,h,pre):b.dataset.t==='pt'?ptDialog(null,key,h,pre):eventDialog(null,key,h,pre));

// Début / fin saisis (HH:MM). Début 0h–3h59 = nuit suivante ; fin plus petite que le début = lendemain.
function normTimes(sv,ev){
  const rs=parseT(sv),re=parseT(ev);
  if(isNaN(rs)||isNaN(re))return {s:rs,e:re,msg:'Indique une heure de début et de fin.'};
  let s=rs,e=re;
  if(s<DAY_START)s+=1440;
  if(s>=DAY_END)return {s,e,msg:`La journée va de ${DAY_START/60}h à ${DAY_END/60-24}h le lendemain.`};
  if(re===rs)return {s,e,msg:'La fin doit être différente du début.'};
  while(e<=s)e+=1440;
  if(e-s>16*60)return {s,e,msg:'Une tâche dure 16 h au maximum (fin le lendemain possible).'};
  return {s,e,msg:''};

// là où au moins un jour a une tâche. Ex. tâche 13h–15h : Matin (→13h) | 13h–15h | Après-midi | Soir.
function weekRows(keys){
  const tasks=[];
  keys.forEach((k,i)=>dayParts(k).forEach(p=>tasks.push({...p,day:i,uid:p.o.id+'|'+i+p.tag})));
  if(S.planHours){ // option : planning par heures (une ligne par heure)
    const s0=Math.floor(Math.min(DEF_START,...tasks.map(t=>t.s))/60)*60,e0=Math.min(DAY_END,Math.max(24*60,Math.ceil(Math.max(0,...tasks.map(t=>t.e))/60)*60));
    const hr=[];for(let h=s0;h<e0;h+=60)hr.push({s:h,e:h+60,sig:'',busy:false,name:fmtHM(h),isHour:true});
    return {rows:hr,tasks};
  }
  const winS=Math.min(DEF_START,...tasks.map(t=>t.s));
  const bp=new Set([winS,12*60,18*60,DAY_END]);
  tasks.forEach(t=>{bp.add(t.s);bp.add(t.e)});
  const pts=[...bp].filter(v=>v>=winS&&v<=DAY_END).sort((a,b)=>a-b);
  let rows=[];
  for(let j=0;j<pts.length-1;j++){
    const s=pts[j],e=pts[j+1],sig=tasks.filter(t=>t.s<e&&s<t.e).map(t=>t.uid).sort().join(',');
    rows.push({s,e,sig,busy:sig!==''});

  for(const r of rows){const p=m1[m1.length-1];if(p&&r.busy&&p.busy&&p.sig===r.sig)p.e=r.e;else m1.push({...r})}

  }

  // heures masquées quand la tâche continue (début = suite de la veille, fin = suite le lendemain)

    r.hideE=r.e===DAY_END&&ps.every(t=>t.contOut);

    };
    row.querySelector('.hn').oninput=e=>{x.name=e.target.value;save()};
    row.querySelector('.hs').onchange=e=>{const n=normTimes(e.target.value,fmtT(startOf(x)+x.dur));apply(n.s,n.e,x.days,n.msg)};
    row.querySelector('.he').onchange=e=>{const n=normTimes(fmtT(startOf(x)),e.target.value);apply(n.s,n.e,x.days,n.msg)};
    days(row,x,d=>apply(startOf(x),startOf(x)+x.dur,d,''));
    row.querySelector('.hdel').onclick=e=>{if(!confirmClick(e.currentTarget,'Supprimer ?'))return;S.dtasks=wipe(S.dtasks,x);save();habitsView(m)};
  });
  m.querySelectorAll('.hl-p .hrow').forEach(row=>{
    const x=S.ptasks.find(y=>y.id===row.dataset.id);
    row.querySelector('.hn').oninput=e=>{x.name=e.target.value;save()};
    row.querySelector('.hd').onchange=e=>{x.dur=+e.target.value;save()};
    row.querySelector('.hdel').onclick=e=>{
      if(!confirmClick(e.currentTarget,'Supprimer ?'))return;
      S.pocc.filter(o=>o.tid===x.id).forEach(o=>delete S.checks[o.id+'|'+o.d]);
      S.pocc=S.pocc.filter(o=>o.tid!==x.id);S.ptasks=S.ptasks.filter(y=>y!==x);save();habitsView(m);
    };
  });
  m.querySelector('.add-p').onclick=()=>{
    S.ptasks.push({id:uid(),name:'',dur:60});save();habitsView(m);
    const i=m.querySelectorAll('.hl-p .hn');i[i.length-1].focus();
  };
  m.querySelector('.add-h').onclick=()=>{
    S.habits.push({id:uid(),name:'',days:[0,1,2,3,4,5,6]});save();habitsView(m);
    const i=m.querySelectorAll('.hl-h .hn');i[i.length-1].focus();
  };
  m.querySelector('.add-t').onclick=()=>{
    const free=h=>[0,1,2,3,4,5,6].filter(wd=>!slotConflict(wd,h*60,h*60+60));
    let pick=null;
    for(let h=WK_H0;h<WK_H1&&!pick;h++){const f=free(h);if(f.length===7)pick={h,days:f}}
    for(let h=WK_H0;h<WK_H1&&!pick;h++){const f=free(h);if(f.length)pick={h,days:f}}
    if(!pick){flash('Aucun créneau libre cette semaine');return}
    S.dtasks.push({id:uid(),name:'',days:pick.days,h:pick.h,m:0,dur:60});save();habitsView(m);
    const i=m.querySelectorAll('.hl-t .hn');i[i.length-1].focus();
  };
}
document.getElementById('imp').onclick=importNotes;
document.getElementById('exp').onclick=exportNotes;
render();
/* ===== Menu radial (clic droit) ===== */
(function(){
  let rm=null;
  const close=()=>{if(rm){rm.remove();rm=null}};
  // secteur d'anneau entre angles a0..a1 (degrés, 0 = haut, sens horaire)
  const P=(r,a)=>{const t=(a-90)*Math.PI/180;return[115+r*Math.cos(t),115+r*Math.sin(t)]};
  const sector=(a0,a1,r0,r1)=>{const[p1,p2,p3,p4]=[P(r1,a0),P(r1,a1),P(r0,a1),P(r0,a0)];
    return`M${p1}A${r1} ${r1} 0 0 1 ${p2}L${p3}A${r0} ${r0} 0 0 0 ${p4}Z`};
  const ICON={
    info:'<circle cx="0" cy="-9" r="1.4" fill="#f3e6c4" stroke="none"/><path d="M0 -3V9"/>',
    edit:'<path d="M-8 9l1-5L5 -8l4 4L-3 8z"/>',
    trash:'<path d="M-8 -5h16M-5 -5V9h10V-5M-3 -8h6"/>',
    plus:'<path d="M0 -9V9M-9 0H9"/>',
    note:'<path d="M-7 -9h10l4 4V9H-7z"/><path d="M-3 0h8M-3 4h8"/>',
    folder:'<path d="M-9 -6h6l2 3h10V8H-9z"/>',
    lock:'<rect x="-7" y="-2" width="14" height="10" rx="2"/><path d="M-4 -2V-5a4 4 0 0 1 8 0V-2"/>'
  };
  function open(x,y,items){
    close();
    rm=document.createElement('div');rm.id='rm';
    x=Math.max(120,Math.min(innerWidth-120,x));y=Math.max(120,Math.min(innerHeight-120,y));
    rm.style.left=x+'px';rm.style.top=y+'px';
    // haut / droite / bas / gauche
    const defs=[
      {a:-45,col:'#5b6573',it:items.top,ix:115,iy:46},
      {a:45,col:'#d6c9a8',it:items.right,ix:184,iy:115},
      {a:135,col:'#5fd37e',it:items.bottom,ix:115,iy:184},
      {a:225,col:'#ee5a5a',it:items.left,ix:46,iy:115}];
    const fr=S.menuStyle!=='shogun';
    let s='<svg viewBox="0 0 230 230">';
    if(fr)s+='<defs><linearGradient id="fl" gradientUnits="userSpaceOnUse" x1="9" y1="0" x2="221" y2="0"><stop offset="0" stop-color="#0055A4"/><stop offset=".28" stop-color="#0055A4"/><stop offset=".28" stop-color="#fff"/><stop offset=".72" stop-color="#fff"/><stop offset=".72" stop-color="#EF4135"/><stop offset="1" stop-color="#EF4135"/></linearGradient></defs>';
    defs.forEach((d,i)=>{
      const it=d.it||{},off=!it.fn;
      const dark=fr&&(i===0||i===2); // haut / bas sur la bande blanche : encre bleu marine
      const ink=fr?(dark?'#0b2a5c':'#fff'):'',halo=fr?(dark?'rgba(255,255,255,.9)':'rgba(0,0,0,.35)'):'';
      const sty=fr?` style="stroke:${ink}"`:'',tsty=fr?` style="fill:${ink};stroke:${halo}"`:'';
      s+=`<g class="sg${off?' off':''}" data-i="${i}"><path d="${sector(d.a+1.2,d.a+88.8,52,106)}" fill="${fr?'url(#fl)':d.col}" stroke="${fr?'#0b2a5c':'#c9a43a'}" stroke-opacity="${fr?.6:1}" stroke-width="2"/>${fr?'':`<path d="${sector(d.a+4,d.a+86,56,102)}" fill="none" stroke="rgba(243,230,196,.22)" stroke-width="1"/>`}`
        +`<g transform="translate(${d.ix} ${d.iy-5})" class="ic"${sty}>${ICON[it.icon||'lock']}</g>`
        +`<text class="lb" x="${d.ix}" y="${d.iy+20}"${tsty}>${it.label||''}</text></g>`;
    });
    s+=fr?'<g class="ct"><circle cx="115" cy="115" r="46" fill="#fff" stroke="#0b2a5c" stroke-width="3"/><circle class="c2" cx="115" cy="115" r="33" fill="#EF4135" stroke="#0055A4" stroke-width="3"/><path class="ic" style="stroke:#fff" d="M106 106l18 18M124 106l-18 18"/></g></svg>':'<g class="ct"><circle cx="115" cy="115" r="46" fill="#e4d9c0" stroke="#c9a43a" stroke-width="3"/><circle cx="115" cy="115" r="40" fill="none" stroke="#2b2016" stroke-width="1"/><circle class="c2" cx="115" cy="115" r="31" fill="#8e8e8e" stroke="#c9a43a" stroke-width="2"/><path class="ic" d="M106 106l18 18M124 106l-18 18"/></g></svg>';
    rm.innerHTML=s;document.body.appendChild(rm);
    rm.querySelectorAll('.sg').forEach(g=>g.onclick=e=>{e.stopPropagation();const it=defs[g.dataset.i].it;if(it&&it.fn){close();it.fn()}});
    rm.querySelector('.ct').onclick=close;
  }
  document.addEventListener('contextmenu',e=>{
    if(matchMedia('(pointer:coarse)').matches)return;
    if(e.target.closest('input,textarea,select,[contenteditable=true],.ov'))return;
    e.preventDefault();
    const card=e.target.closest('.kc'),id=card&&card.dataset.id;
    const items=id?{
      top:{label:'Modifier',icon:'edit',fn:()=>openNote(id)},
      left:{label:'Supprimer',icon:'trash',fn:()=>{S.notes=S.notes.filter(n=>n.id!==id);save();renderContent()}},
      bottom:{label:'Note rapide',icon:'note',fn:()=>openNote()}
    }:{
      top:{label:'Note rapide',icon:'note',fn:()=>openNote()},
      bottom:{label:'Nouveau projet',icon:'folder',fn:()=>newProject()}
    };
    open(e.clientX,e.clientY,items);
  });
  document.addEventListener('pointerdown',e=>{if(rm&&!e.target.closest('#rm'))close()},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  addEventListener('blur',close);addEventListener('scroll',close,true);
})();
/* ===== Options : taille de la barre horizontale ===== */
(function(){
  function applyBar(){
    const r1=document.getElementById('titles').parentElement,r2=document.getElementById('subs').parentElement;
    if(S.barBig!==false)document.querySelector('main').before(r1,r2);
    else document.getElementById('side').prepend(r1,r2);
  }
  function applyFont(){document.body.classList.toggle('fba',S.font==='ba');if(typeof fitWeek==='function')requestAnimationFrame(fitWeek)}
 function applyHourPos(){document.body.classList.toggle('hpl',S.hourPos==='line');if(typeof fitWeek==='function')requestAnimationFrame(fitWeek)}
  function openOpt(){
    if(document.getElementById('ovo'))return;
    const o=document.createElement('div');o.className='ov';o.id='ovo';
    o.innerHTML=`<div class='modal mopt'><h3>Options</h3><div class='lbl'>Barre horizontale</div><div class='seg'><button data-v='1'>Grande</button><button data-v='0'>Petite</button></div><p class='hint'>Grande : sur toute la largeur en haut de la page. Petite : dans la barre latérale.</p><div class='lbl' style='margin-top:16px'>Affichage du planning</div><div class='seg seg2'><button data-p='0'>Matin / Après-midi / Soir</button><button data-p='1'>Heures</button></div><p class='hint'>Heures : une ligne par heure de la journée.</p><div class='lbl' style='margin-top:16px'>Position des heures</div><div class='seg seg5'><button data-h='0'>Au centre</button><button data-h='1'>Sur la ligne</button></div><p class='hint'>Sur la ligne : l’heure est alignée sur le trait, comme dans un agenda classique.</p><div class='lbl' style='margin-top:16px'>Style du clic droit</div><div class='seg seg4'><button data-m='fr'>Drapeau français</button><button data-m='shogun'>Shogun</button></div><div class='lbl' style='margin-top:16px'>Police</div><div class='seg seg3'><button data-f='0'>Actuelle</button><button data-f='1' style='font-family:"Book Antiqua","Palatino Linotype",Palatino,serif'>Book Antiqua</button></div><div class='ofin'><button class='oclose' style='height:34px;width:auto;flex:none;padding:0 18px;display:block'>Fermer</button></div></div>`;
    const mark=()=>{o.querySelectorAll('.seg:not(.seg2) button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===(S.barBig!==false)));o.querySelectorAll('.seg2 button').forEach(b=>b.classList.toggle('on',(b.dataset.p==='1')===!!S.planHours));o.querySelectorAll('.seg3 button').forEach(b=>b.classList.toggle('on',(b.dataset.f==='1')===(S.font==='ba')));o.querySelectorAll('.seg4 button').forEach(b=>b.classList.toggle('on',(b.dataset.m==='shogun')===(S.menuStyle==='shogun')));o.querySelectorAll('.seg5 button').forEach(b=>b.classList.toggle('on',(b.dataset.h==='1')===(S.hourPos==='line')))};
    const close=()=>{o.remove();document.removeEventListener('keydown',esc,true)};
    const esc=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};
    o.querySelectorAll('.seg:not(.seg2) button').forEach(b=>b.onclick=()=>{S.barBig=b.dataset.v==='1';save();applyBar();mark()});
    o.querySelectorAll('.seg2 button').forEach(b=>b.onclick=()=>{S.planHours=b.dataset.p==='1';save();renderContent();mark()});
    o.querySelectorAll('.seg4 button').forEach(b=>b.onclick=()=>{S.menuStyle=b.dataset.m;save();mark()});
    o.querySelectorAll('.seg3 button').forEach(b=>b.onclick=()=>{S.font=b.dataset.f==='1'?'ba':'';save();applyFont();mark()});
 o.querySelectorAll('.seg5 button').forEach(b=>b.onclick=()=>{S.hourPos=b.dataset.h==='1'?'line':'';save();applyHourPos();mark()});
    o.querySelector('.oclose').onclick=close;
    o.onmousedown=e=>{if(e.target===o)close()};
    document.addEventListener('keydown',esc,true);
    mark();document.body.appendChild(o);
  }
  document.getElementById('opt').onclick=openOpt;
  applyBar();applyFont();applyHourPos();
})();
</script>
