<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes & Planning</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--bar:#171a21;--bar2:#1d212a;--line:#2a2f3a;--txt:#e6e8ec;--mut:#8b93a3;--acc:#6ea8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.bar{display:flex;width:100%;background:var(--bar);border-bottom:1px solid var(--line)}
.bar.sub{background:var(--bar2)}
.tab{flex:1 1 0;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:14px 8px;cursor:pointer;user-select:none;color:var(--mut);border-right:1px solid var(--line);border-bottom:2px solid transparent;transition:background .15s,color .15s}
.sub .tab{padding:10px 8px;font-size:14px}
.tab:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.tab.active{color:var(--txt);border-bottom-color:var(--acc);background:rgba(110,168,255,.08)}
.tab.over{box-shadow:inset 3px 0 0 var(--acc)}
.tab.drag{opacity:.4}
.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none;max-width:100%;padding:0 18px}
.label[contenteditable=true]{background:#0b0d11;border:1px solid var(--acc);border-radius:4px;color:var(--txt);text-overflow:clip;cursor:text}
.x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:var(--mut);cursor:pointer;font-size:14px;line-height:1;display:none}
.tab:hover .x{display:block}
.x:hover{background:#3a2025;color:#ff8a8a}
.add{flex:0 0 44px;border:0;background:transparent;color:var(--mut);font-size:20px;cursor:pointer}
.add:hover{color:var(--acc);background:rgba(255,255,255,.04)}
.bar.sub{height:44px}
.add.empty{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.add.empty b{font-size:20px;font-weight:400;line-height:1}
main{flex:1;min-height:0}
.view{flex:1;min-height:0;display:flex}
main{display:flex}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
.side{width:220px;flex:none;background:var(--bar);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;transition:width .2s;overflow:hidden}
.side.closed{width:60px}
.side button{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:inherit;cursor:pointer;white-space:nowrap}
.side button:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.side .it.on{background:rgba(110,168,255,.12);color:var(--txt)}
.side .tog{margin-bottom:8px}
.side .ic{width:20px;height:20px;flex:none;display:flex}
.side svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .tx{transition:opacity .15s}
.side.closed .tx{opacity:0}
.week{flex:1;min-width:0;display:flex;padding:12px}
.grid{display:grid;grid-template-columns:52px repeat(7,1fr);flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bar)}
.dh{padding:8px;text-align:center;color:var(--mut);border-left:1px solid var(--line)}
.dh b{color:var(--txt);margin-left:6px}
.dh.today b{background:var(--acc);color:#0f1115;border-radius:10px;padding:1px 7px}
.hr{font-size:11px;color:var(--mut);text-align:right;padding:3px 8px 0 0;border-top:1px solid var(--line)}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:0}
.cell.today{background:rgba(110,168,255,.05)}
.notes{flex:1;min-height:0;overflow:auto;padding:20px}
.nh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.nh h2{margin:0;font-size:18px;font-weight:600}
.nn,.ok,.ghost{border:1px solid var(--line);background:var(--bar2);color:var(--txt);font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer}
.nn:hover,.ghost:hover{border-color:var(--acc)}
.ok{background:var(--acc);border-color:var(--acc);color:#0f1115;font-weight:600}
.nl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.nc{position:relative;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;min-height:90px;display:flex;flex-direction:column;gap:10px}
.nc:hover{border-color:var(--acc)}
.nt{white-space:pre-wrap;word-break:break-word;flex:1}
.nd{font-size:12px;color:var(--mut)}
.nx{position:absolute;top:6px;right:6px;width:22px;height:22px;border:0;border-radius:50%;background:transparent;color:var(--mut);cursor:pointer;display:none}
.nc:hover .nx{display:block}
.nx:hover{background:#3a2025;color:#ff8a8a}
.empty{color:var(--mut)}
.sn{width:100%;max-width:480px;margin:0 auto;padding:12px 14px;overflow:auto;min-height:0;flex:1}
.snh{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 10px}
.snh h2{margin:0;font-size:20px;font-weight:700}
.snp{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--txt);font-size:20px;cursor:pointer}
.snp:hover{background:rgba(255,255,255,.07)}
.sr{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 8px;border-top:1px solid var(--line);cursor:pointer}
.sr:hover{background:rgba(255,255,255,.04)}
.st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sx:hover{background:#3a2025;color:#ff8a8a}
.sx svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:15vh;z-index:30}
.modal{width:min(560px,92vw);background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mh{font-weight:600;margin-bottom:10px}
.modal textarea{width:100%;height:160px;resize:vertical;background:#0b0d11;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;outline:none}
.modal textarea:focus{border-color:var(--acc)}
.mf{display:flex;align-items:center;gap:8px;margin-top:12px}
.hint{flex:1;font-size:12px;color:var(--mut)}
.menu{position:fixed;z-index:20;width:180px;background:var(--bar2);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:transparent;color:var(--txt);font:inherit;border-radius:6px;cursor:pointer}
.menu button:hover{background:rgba(255,255,255,.07)}
</style>
</head>
<body>
<div class="bar" id="titles"></div>
<div class="bar sub" id="subs"></div>
<main><aside class="side" id="side"></aside><section id="content"></section></main>

<script>
const KEY='planning-v2';
const uid=()=>Math.random().toString(36).slice(2,8);
const mk=(n)=>({id:uid(),name:n});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tabs||!S.tabs.length){
  const a=mk('Agenda'),c=mk('Classeur');
  a.subs=[{id:uid(),name:'Semaine',kind:'week'}];
  c.subs=[];
  S={tabs:[a,c],active:a.id,sub:{}};
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
S.notes=S.notes||[];S.sub=S.sub||{};
if(!S.qnInit){S.qnInit=true;const c=S.tabs.find(x=>x.name==='Classeur')||S.tabs[S.tabs.length-1];const n={id:uid(),name:'Notes rapides',kind:'notes'};c.subs.unshift(n);S.sub[c.id]=n.id}
if(!S.sbInit){S.sbInit=true;S.tabs.push({id:uid(),name:'Sidebar',kind:'sidebar',subs:[]})}
const curTab=()=>S.tabs.find(t=>t.id===S.active)||S.tabs[0];

function bar(el,items,activeId,o){
  el.innerHTML='';
  let from=null;
  items.forEach((it,i)=>{
    const t=document.createElement('div');
    t.className='tab'+(it.id===activeId?' active':'');
    t.draggable=true;
    const l=document.createElement('span');
    l.className='label';l.textContent=it.name;
    t.appendChild(l);
    if(items.length>1){
      const x=document.createElement('button');
      x.className='x';x.textContent='×';x.title='Supprimer';
      x.onclick=e=>{e.stopPropagation();o.remove(i)};
      t.appendChild(x);
    }
    t.onclick=()=>{if(l.isContentEditable||t.classList.contains('active'))return;el.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n===t));o.select(it.id)};
    t.ondblclick=e=>{
      e.preventDefault();
      t.draggable=false;l.contentEditable='true';l.focus();
      const r=document.createRange();r.selectNodeContents(l);
      const s=getSelection();s.removeAllRanges();s.addRange(r);
    };
    const done=ok=>{
      if(!l.isContentEditable)return;
      const v=l.textContent.trim();
      l.contentEditable='false';t.draggable=true;
      if(ok&&v)it.name=v;
      l.textContent=it.name;save();
    };
    l.onkeydown=e=>{
      if(e.key==='Enter'){e.preventDefault();done(true)}
      if(e.key==='Escape'){done(false)}
    };
    l.onblur=()=>done(true);
    t.ondragstart=e=>{from=i;t.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))};
    t.ondragend=()=>{t.classList.remove('drag');el.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))};
    t.ondragover=e=>{e.preventDefault();t.classList.add('over')};
    t.ondragleave=()=>t.classList.remove('over');
    t.ondrop=e=>{
      e.preventDefault();
      if(from===null||from===i)return;
      const [m]=items.splice(from,1);items.splice(i,0,m);
      from=null;save();render();
    };
    el.appendChild(t);
  });
  const a=document.createElement('button');
  a.className='add';a.title='Ajouter';a.onclick=o.add;
  if(!items.length&&o.empty){a.className='add empty';a.innerHTML='<b>+</b><span>'+o.empty+'</span>'}else a.textContent='+';
  el.appendChild(a);
}

function render(){
  if(!document.getElementById('side').firstChild)renderSide();
  const t=curTab();S.active=t.id;
  if(!S.sub[t.id]||!t.subs.find(s=>s.id===S.sub[t.id]))S.sub[t.id]=t.subs[0]&&t.subs[0].id;
  bar(document.getElementById('titles'),S.tabs,t.id,{
    select:id=>{S.active=id;save();renderSubs()},
    add:()=>{const n=mk('Nouveau');n.subs=[];S.tabs.push(n);S.active=n.id;save();render()},
    remove:i=>{S.tabs.splice(i,1);save();render()}
  });
  renderSubs();
}
function renderSubs(){
  const t=curTab();
  if(!S.sub[t.id]||!t.subs.find(s=>s.id===S.sub[t.id]))S.sub[t.id]=t.subs[0]&&t.subs[0].id;
  bar(document.getElementById('subs'),t.subs,S.sub[t.id],{
    select:id=>{S.sub[t.id]=id;save();renderContent()},
    empty:'Nouveau dossier',
    add:e=>{
      const mkSub=(name,kind)=>{const n={id:uid(),name,kind};t.subs.push(n);S.sub[t.id]=n.id;save();render()};
      if(S.tabs.some(x=>x.subs.some(s=>s.kind==='notes')))mkSub('Nouveau dossier');
      else menu(e.currentTarget,[['Notes rapides',()=>mkSub('Notes rapides','notes')],['Dossier vide',()=>mkSub('Nouveau dossier')]]);
    },
    remove:i=>{t.subs.splice(i,1);save();render()}
  });
  save();renderContent();
}
const SV=p=>`<svg viewBox='0 0 24 24'>${p}</svg>`;
const IC={tog:SV(`<rect x='3' y='4' width='18' height='16' rx='2'/><path d='M9 4v16'/>`),cal:SV(`<rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/>`),chk:SV(`<rect x='3' y='3' width='18' height='18' rx='3'/><path d='M8 12l3 3 5-6'/>`),bell:SV(`<path d='M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4'/>`)};
IC.note=SV(`<path d='M4 20h4L19 9l-4-4L4 16z'/><path d='M13 7l4 4'/>`);
function renderSide(){
  const sd=document.getElementById('side');
  sd.classList.toggle('closed',!!S.side);
  sd.innerHTML=`<button class='tog' title='Réduire / ouvrir'><span class='ic'>${IC.tog}</span></button><button class='it' title='Note rapide'><span class='ic'>${IC.note}</span><span class='tx'>Note rapide</span></button>`;
  sd.querySelector('.tog').onclick=()=>{S.side=!S.side;sd.classList.toggle('closed',S.side);save()};
  sd.querySelector('.it').onclick=()=>openNote();
}
function menu(b,items){
  document.querySelectorAll('.menu').forEach(n=>n.remove());
  const m=document.createElement('div');m.className='menu';
  items.forEach(([n,f])=>{const i=document.createElement('button');i.textContent=n;i.onclick=()=>{m.remove();f()};m.appendChild(i)});
  const r=b.getBoundingClientRect();
  m.style.top=(r.bottom+4)+'px';m.style.left=Math.max(8,Math.min(r.left+r.width/2-90,innerWidth-188))+'px';
  document.body.appendChild(m);
  setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0);
}
const closeNote=()=>{const o=document.getElementById('ov');if(o)o.remove()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNote()});
function openNote(id){
  closeNote();
  const n=id&&S.notes.find(x=>x.id===id);
  const o=document.createElement('div');o.className='ov';o.id='ov';
  o.innerHTML=`<div class='modal'><div class='mh'>${n?'Modifier la note':'Note rapide'}</div><textarea placeholder='Écris ta note…'></textarea><div class='mf'><span class='hint'>Ctrl+Entrée pour enregistrer · Échap pour fermer</span><button class='ghost'>Annuler</button><button class='ok'>Enregistrer</button></div></div>`;
  const ta=o.querySelector('textarea');ta.value=n?n.text:'';
  const done=()=>{const v=ta.value.trim();if(!v)return;if(n)n.text=v;else S.notes.unshift({id:uid(),text:v,t:Date.now()});save();closeNote();renderContent()};
  o.querySelector('.ok').onclick=done;
  o.querySelector('.ghost').onclick=closeNote;
  o.onmousedown=e=>{if(e.target===o)closeNote()};
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();done()}};
  document.body.appendChild(o);ta.focus();
}
function notesView(m){
  const f=t=>new Date(t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const cards=S.notes.map(n=>`<div class='nc' data-id='${n.id}'><div class='nt'>${esc(n.text)}</div><div class='nd'>${f(n.t)}</div><button class='nx' title='Supprimer'>×</button></div>`).join('');
  m.innerHTML=`<section class='notes'><div class='nh'><h2>Notes rapides</h2><button class='nn'>+ Nouvelle note</button></div><div class='nl'>${cards||`<div class='empty'>Aucune note pour l'instant.</div>`}</div></section>`;
  m.querySelector('.nn').onclick=()=>openNote();
  m.querySelectorAll('.nc').forEach(c=>{
    c.onclick=()=>openNote(c.dataset.id);
    c.querySelector('.nx').onclick=e=>{e.stopPropagation();S.notes=S.notes.filter(n=>n.id!==c.dataset.id);save();renderContent()};
  });
}
function sidebarView(m){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const trash=SV(`<path d='M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13'/>`);
  const rows=S.notes.map(n=>`<div class='sr' data-id='${n.id}'><span class='st'>${esc(n.text.split('\n')[0])}</span><button class='sx' title='Supprimer'>${trash}</button></div>`).join('');
  m.innerHTML=`<section class='sn'><div class='snh'><h2>Notes</h2><button class='snp' title='Nouvelle note'>+</button></div>${rows||`<div class='empty'>Aucune note pour l'instant.</div>`}</section>`;
  m.querySelector('.snp').onclick=()=>openNote();
  m.querySelectorAll('.sr').forEach(r=>{
    r.onclick=()=>openNote(r.dataset.id);
    r.querySelector('.sx').onclick=e=>{e.stopPropagation();S.notes=S.notes.filter(n=>n.id!==r.dataset.id);save();renderContent()};
  });
}
function renderContent(){
  const t=curTab(),s=t.subs.find(x=>x.id===S.sub[t.id]),m=document.getElementById('content');
  m.innerHTML='';
  const sb=t.kind==='sidebar';
  document.getElementById('subs').style.display=sb?'none':'';
  document.getElementById('side').style.display=sb?'none':'';
  if(sb)sidebarView(m);
  else if(s&&s.kind==='week')weekView(m);
  else if(s&&s.kind==='notes')notesView(m);
}
function weekView(m){
  const D=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],H0=8,H1=20,now=new Date(),ti=(now.getDay()+6)%7,mon=new Date(now);
  mon.setDate(now.getDate()-ti);
  const item=(ic,tx,on)=>`<button class='it${on?' on':''}' title='${tx}'><span class='ic'>${IC[ic]}</span><span class='tx'>${tx}</span></button>`;
  let g=`<div class='grid' style='grid-template-rows:auto repeat(${H1-H0},minmax(0,1fr))'><div></div>`;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);g+=`<div class='dh${i===ti?' today':''}'>${D[i]}<b>${d.getDate()}</b></div>`}
  for(let r=H0;r<H1;r++){g+=`<div class='hr'>${r}h</div>`;for(let i=0;i<7;i++)g+=`<div class='cell${i===ti?' today':''}'></div>`}
  g+='</div>';
  m.innerHTML=`<div class='view'><section class='week'>${g}</section></div>`;
}
render();
</script>
</body>
</html>
